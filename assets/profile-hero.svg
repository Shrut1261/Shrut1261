<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Shrut Prajapati premium GitHub profile hero</title>
  <desc id="desc">A premium dark analytics profile banner with a professional avatar, clean headline, metric cards, and animated signal chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".48" stop-color="#08111f"/>
      <stop offset="1" stop-color="#06342f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".72" stop-color="#07111f"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx=".5" cy=".5" r=".58">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".58"/>
      <stop offset=".55" stop-color="#2dd4bf" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="36" fill="url(#bg)"/>
  <g opacity=".22">
    <path d="M0 346C172 256 288 296 428 210S668 82 884 136s336 26 516-86" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M0 398C188 304 330 340 502 250S796 128 1014 190s310 12 386-56" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M82 72h1236M82 154h1236M82 236h1236M82 318h1236M82 400h1236" stroke="#1d3148"/>
    <path d="M176 42v372M356 42v372M536 42v372M716 42v372M896 42v372M1076 42v372M1256 42v372" stroke="#122940"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="58" y="52" width="1284" height="356" rx="32" fill="url(#panel)" stroke="#28415f" stroke-width="2"/>
  </g>

  <g transform="translate(100 88)">
    <rect x="0" y="0" width="300" height="284" rx="28" fill="#07111f" stroke="#24415f"/>
    <rect x="24" y="24" width="252" height="166" rx="22" fill="#0b1424" stroke="#1e3652"/>
    <circle cx="150" cy="108" r="104" fill="url(#avatarGlow)"/>
    <image href="original-avatar.png" x="22" y="36" width="256" height="153" preserveAspectRatio="xMidYMid meet"/>
    <text x="150" y="226" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="950">Shrut Prajapati</text>
    <text x="150" y="254" text-anchor="middle" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">Analytics + ML + Quant</text>
  </g>

  <g transform="translate(450 98)">
    <text x="0" y="34" fill="#e0f2fe" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="900" letter-spacing="2">DATA PRODUCT PORTFOLIO</text>
    <text x="0" y="88" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="50" font-weight="950">Turning raw data into</text>
    <text x="0" y="142" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="50" font-weight="950">decision-ready systems.</text>
    <text x="0" y="184" fill="#bfd7f2" font-family="Inter,Segoe UI,Arial" font-size="21" font-weight="700">SQL / Python / BI / Machine Learning / Quant Analytics</text>
    <text x="0" y="222" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial" font-size="18">Dashboards, tested models, APIs, and case studies built for real interview conversations.</text>
    <g transform="translate(0 254)" font-family="Inter,Segoe UI,Arial">
      <rect x="0" y="0" width="158" height="44" rx="22" fill="#082f49" stroke="#38bdf8"/>
      <text x="79" y="28" text-anchor="middle" fill="#e0f2fe" font-size="15" font-weight="900">Analytics Engineer</text>
      <rect x="178" y="0" width="132" height="44" rx="22" fill="#0f342f" stroke="#2dd4bf"/>
      <text x="244" y="28" text-anchor="middle" fill="#ccfbf1" font-size="15" font-weight="900">ML Systems</text>
      <rect x="330" y="0" width="154" height="44" rx="22" fill="#1f3513" stroke="#a3e635"/>
      <text x="407" y="28" text-anchor="middle" fill="#ecfccb" font-size="15" font-weight="900">Finance Signals</text>
    </g>
  </g>

  <g transform="translate(1038 104)" font-family="Inter,Segoe UI,Arial">
    <rect x="0" y="0" width="244" height="72" rx="16" fill="#081523" stroke="#263d59"/>
    <text x="24" y="30" fill="#93c5fd" font-size="14" font-weight="800">Flagship</text>
    <text x="24" y="56" fill="#f8fafc" font-size="24" font-weight="950">AlphaSignal</text>
    <rect x="0" y="92" width="244" height="72" rx="16" fill="#081523" stroke="#263d59"/>
    <text x="24" y="122" fill="#93c5fd" font-size="14" font-weight="800">Portfolio</text>
    <text x="24" y="148" fill="#f8fafc" font-size="24" font-weight="950">11+ Builds</text>
    <rect x="0" y="184" width="244" height="110" rx="16" fill="#081523" stroke="#263d59"/>
    <text x="24" y="220" fill="#e5f2ff" font-size="18" font-weight="900">Project Signal</text>
    <path d="M24 268C58 248 80 256 110 232s56-8 84-24 42-5 56-18" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M24 268C58 248 80 256 110 232s56-8 84-24 42-5 56-18;M24 258C56 236 82 246 112 220s58-2 84-18 42 0 54-28;M24 268C58 248 80 256 110 232s56-8 84-24 42-5 56-18"/>
    </path>
    <path d="M22 280H222M22 248H222M22 216H222" stroke="#1e3149"/>
  </g>
</svg>
