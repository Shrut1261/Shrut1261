  <title id="title">Technical edge skills map</title>
  <desc id="desc">A skills map for analytics, data engineering, machine learning, application layer, and finance analytics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1400" height="310" rx="28" fill="url(#bg)" stroke="#243a55"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="950">Technical Edge</text>
  <text x="60" y="104" fill="#9fb8d8" font-family="Inter,Segoe UI,Arial" font-size="18">A practical stack for analytics products, not just notebooks.</text>
