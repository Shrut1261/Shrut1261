<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Shrut Prajapati profile banner</title>
  <desc id="desc">A modern analytics and machine learning profile banner with animated charts, data cards, and a quant intelligence dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".48" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#06241f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="34" fill="url(#bg)"/>
  <g opacity=".22">
    <path d="M0 318C175 208 250 272 396 176S673 66 889 122s348-2 511-92" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M0 360C169 270 298 315 455 232S713 119 908 170s344 44 492-42" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <g stroke="#1f3650">
      <path d="M80 72h1240M80 148h1240M80 224h1240M80 300h1240"/>
      <path d="M150 50v310M310 50v310M470 50v310M630 50v310M790 50v310M950 50v310M1110 50v310M1270 50v310"/>
    </g>
  </g>

  <g transform="translate(76 72)">
    <text x="0" y="44" fill="#e5f2ff" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900">Shrut Prajapati</text>
    <text x="0" y="84" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="600">Data Analytics • Machine Learning • Quant Intelligence</text>
    <text x="0" y="130" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial" font-size="19">I turn raw data into dashboards, models, APIs, and decision systems.</text>
    <rect x="0" y="168" width="162" height="42" rx="21" fill="#0f2f3d" stroke="#38bdf8"/>
    <text x="24" y="196" fill="#e0f2fe" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="800">SQL + Python</text>
    <rect x="184" y="168" width="194" height="42" rx="21" fill="#102c2b" stroke="#2dd4bf"/>
    <text x="208" y="196" fill="#ccfbf1" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="800">BI + ML Products</text>
    <rect x="400" y="168" width="210" height="42" rx="21" fill="#173019" stroke="#a3e635"/>
    <text x="424" y="196" fill="#ecfccb" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="800">Finance Analytics</text>
  </g>

  <g transform="translate(770 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="552" height="284" rx="24" fill="#0a1220" stroke="#24364d" stroke-width="2"/>
    <rect x="28" y="30" width="154" height="78" rx="14" fill="#0d1b2e" stroke="#223a54"/>
    <text x="48" y="62" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="16">Portfolio</text>
    <text x="48" y="94" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="900">11+</text>
    <rect x="204" y="30" width="154" height="78" rx="14" fill="#0d1b2e" stroke="#223a54"/>
    <text x="224" y="62" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="16">Focus</text>
    <text x="224" y="94" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="900">Data</text>
    <rect x="380" y="30" width="144" height="78" rx="14" fill="#0d1b2e" stroke="#223a54"/>
    <text x="400" y="62" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="16">Builds</text>
    <text x="400" y="94" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="900">ML</text>

    <rect x="28" y="142" width="320" height="112" rx="16" fill="#07111c" stroke="#20364d"/>
    <text x="48" y="172" fill="#e5f2ff" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800">Signal Quality</text>
    <path d="M50 226C92 211 112 214 150 190s66-13 102-31 58-19 76-36" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="4.5s" repeatCount="indefinite" values="M50 226C92 211 112 214 150 190s66-13 102-31 58-19 76-36;M50 220C98 194 121 208 154 178s69-5 104-28 50-13 70-47;M50 226C92 211 112 214 150 190s66-13 102-31 58-19 76-36"/>
    </path>
    <path d="M50 234H320M50 204H320M50 174H320" stroke="#1d2d41"/>

    <rect x="374" y="142" width="150" height="112" rx="16" fill="#07111c" stroke="#20364d"/>
    <text x="398" y="172" fill="#e5f2ff" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800">Stack</text>
    <rect x="404" y="216" width="18" height="28" rx="5" fill="#38bdf8">
      <animate attributeName="height" values="28;52;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="216;192;216" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="436" y="198" width="18" height="46" rx="5" fill="#2dd4bf">
      <animate attributeName="height" values="46;68;46" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;176;198" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="468" y="184" width="18" height="60" rx="5" fill="#a3e635">
      <animate attributeName="height" values="60;36;60" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="184;208;184" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
